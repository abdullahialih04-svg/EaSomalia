<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Opportunities | EA Somalia</title>

  <link rel="icon" href="/images/logo.png">

  <meta
    name="description"
    content="Jobs, fellowships and funding to help you work on pressing problems."
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;800&family=Source+Serif+4:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/opportunities.css">
</head>

<body>

  <!-- Navigation -->
  <div id="site-nav"></div>

  <main class="opp-page">

    <!-- Header -->
    <section class="opp-head">
      <div class="wrap opp-head-inner">

        <div>
          <h1>Opportunities</h1>
          <p>Jobs, fellowships and funding to help you work on pressing problems.</p>
        </div>

        <aside class="opp-advisor">
          <p>Get career advice matched to your background</p>
          <a
            href="https://app.80000hours.org/?utm_source=80k_job_board&utm_medium=tab&flow=explore-jobs"
            target="_blank"
            rel="noopener noreferrer"
          >
            AI Career Advisor ↗
          </a>
        </aside>

      </div>
    </section>

    <!-- Opportunities Board -->
    <section class="opp-board">
      <div class="wrap">

        <!-- Tabs -->
        <div class="opp-tabs">
          <span class="opp-tab active">Search Opportunities</span>

          <a
            class="opp-tab"
            href="https://app.80000hours.org/?utm_source=80k_job_board&utm_medium=tab&flow=explore-jobs"
            target="_blank"
            rel="noopener noreferrer"
          >
            AI Career Advisor ↗
          </a>
        </div>

        <!-- Search and Filters -->
        <div class="opp-filter-card">

          <div class="opp-search-row">
            <div class="opp-searchbox">

              <svg
                class="opp-search-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
              </svg>

              <input
                id="opp-search"
                class="opp-input"
                type="search"
                placeholder="Keywords"
                aria-label="Search opportunities"
              >

            </div>
          </div>

          <div class="opp-filters">
            <select id="f-area" aria-label="Area"></select>
            <select id="f-type" aria-label="Type"></select>
            <select id="f-source" aria-label="Source"></select>
            <select id="f-location" aria-label="Location"></select>
            <select id="f-org" aria-label="Organisation"></select>
            <select id="f-closing" aria-label="Closing date"></select>
          </div>

        </div>

        <!-- Count and Sort -->
        <div class="opp-bar">

          <div class="opp-bar-left">
            <strong id="opp-count">0 opportunities</strong>

            <label class="opp-sort">
              <span class="sr-only">Sort by</span>
              <select id="f-sort" aria-label="Sort by"></select>
            </label>
          </div>

          <button
            id="f-clear"
            class="opp-clear"
            type="button"
          >
            Clear filters
          </button>

        </div>

        <!-- Opportunity List -->
        <div id="job-list">
          <div class="opp-empty">Loading opportunities…</div>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="site-footer"></div>

  <!-- Shared JavaScript -->
  <script src="/js/components.js"></script>
  <script src="/js/Jobs.js"></script>

</body>
</html>
