
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Opportunities | EA Somalia</title>

  <meta
    name="description"
    content="Explore jobs, fellowships, internships and funding opportunities through EA Somalia."
  >

  <meta name="theme-color" content="#ffffff">

  <link rel="icon" href="/images/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;800&family=Source+Serif+4:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/opportunities.css">
</head>

<body>

  <div id="site-nav"></div>

  <main class="opp-page">

    <section class="opp-head">
      <div class="wrap opp-head-inner">

        <div>
          <h1>Opportunities</h1>
          <p>
            Explore jobs, fellowships and funding opportunities
            to help you work on pressing problems.
          </p>
        </div>

        <aside class="opp-advisor">
          <p>Get career advice matched to your background</p>

          <a
            href="https://app.80000hours.org/?utm_source=80k_job_board&utm_medium=tab&flow=explore-jobs"
            target="_blank"
            rel="noopener noreferrer"
          >
            AI Career Advisor ↗
          </a>
        </aside>

      </div>
    </section>

    <section class="opp-board">
      <div class="wrap">

        <div class="opp-tabs">

          <span class="opp-tab active">
            Search Opportunities
          </span>

          <a
            class="opp-tab"
            href="https://app.80000hours.org/?utm_source=80k_job_board&utm_medium=tab&flow=explore-jobs"
            target="_blank"
            rel="noopener noreferrer"
          >
            AI Career Advisor ↗
          </a>

        </div>

        <div class="opp-filter-card">

          <div class="opp-search-row">
            <div class="opp-searchbox">

              <svg
                class="opp-search-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20l-3.5-3.5"></path>
              </svg>

              <input
                id="opp-search"
                class="opp-input"
                type="search"
                placeholder="Search by keyword, role or organisation"
                aria-label="Search opportunities"
              >

            </div>
          </div>

          <div class="opp-filters">

            <select id="f-area" aria-label="Filter by area">
              <option value="all">All areas</option>
            </select>

            <select id="f-type" aria-label="Filter by opportunity type">
              <option value="all">All types</option>
            </select>

            <select id="f-source" aria-label="Filter by source">
              <option value="all">All sources</option>
            </select>

            <select id="f-location" aria-label="Filter by location">
              <option value="all">All locations</option>
            </select>

            <select id="f-org" aria-label="Filter by organisation">
              <option value="all">All organisations</option>
            </select>

            <select id="f-closing" aria-label="Filter by closing date">
              <option value="all">Any closing date</option>
              <option value="7">Closing within 7 days</option>
              <option value="30">Closing within 30 days</option>
              <option value="60">Closing within 60 days</option>
              <option value="open">No closing date</option>
            </select>

          </div>

        </div>

        <div class="opp-bar">

          <div class="opp-bar-left">

            <strong id="opp-count" aria-live="polite">
              0 opportunities
            </strong>

            <label class="opp-sort">
              <span class="sr-only">Sort by</span>

              <select id="f-sort" aria-label="Sort opportunities">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="deadline">Closing date</option>
              </select>
            </label>

          </div>

          <button
            id="f-clear"
            class="opp-clear"
            type="button"
          >
            Clear filters
          </button>

        </div>

        <div
          id="job-list"
          aria-live="polite"
          aria-busy="false"
        >
          <div class="opp-empty">
            Loading opportunities…
          </div>
        </div>

      </div>
    </section>

  </main>

  <!--
    OPPORTUNITY DATABASE

    Add, edit or remove opportunities in this section.
    Do not add jobs to jobs.json anymore.

    Required data attributes:
    data-title
    data-organization
    data-area
    data-type
    data-location
    data-source
    data-closing
    data-posted

    Use YYYY-MM-DD for dates.
  -->

  <div id="jobs-data" hidden>

    <!--
    EXAMPLE ENTRY TEMPLATE

    Copy this article for each real opportunity.
    Replace all example details and the application URL.

    <article
      class="job-record"
      data-title="AI Policy Researcher"
      data-organization="Organisation Name"
      data-area="AI Safety"
      data-type="Full-time"
      data-location="Remote"
      data-source="Organisation Website"
      data-closing="2026-12-15"
      data-posted="2026-11-04"
    >
      <p class="job-description">
        Add a short description of the opportunity here.
      </p>

      <a
        class="job-apply"
        href="https://example.org/apply"
        target="_blank"
        rel="noopener noreferrer"
      >
        Apply now
      </a>
    </article>
    -->

  </div>

  <div id="site-footer"></div>

  <script src="/js/components.js"></script>
  <script src="/js/Jobs.js?v=3" defer></script>

</body>
</html>
